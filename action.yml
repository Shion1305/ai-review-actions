name: Pydantic AI PRレビュー
description: Pydantic AI経由のGeminiと分離されたDockerサンドボックスでPull Requestをレビューします。
author: ynufes-tech

branding:
  icon: search
  color: blue

inputs:
  gemini-api-key:
    description: Pydantic AIのオーケストレーターが使用するGemini APIキー。
    required: true
  model:
    description: 使用するGeminiモデル名。
    required: false
    default: gemini-3.8-flash
  review-language:
    description: モデルが生成する要約・指摘・評価などの言語。Action固定の表示文は日本語。
    required: false
    default: 日本語
  repository:
    description: owner/name形式の対象リポジトリ。
    required: true
  pull-request-number:
    description: レビュー対象のPull Request番号。
    required: true
  base-sha:
    description: Pull RequestのBaseコミットSHA。
    required: true
  head-sha:
    description: Pull RequestのHeadコミットSHA。
    required: true
  review-base-sha:
    description: 前回レビュー済みのコミットSHA。祖先でない場合はPR全体の比較へ戻します。
    required: false
    default: ""
  review-context:
    description: context Actionが取得したPR説明・レビュー・返信の上限付きJSON。
    required: false
    default: "{}"
  model-input-byte-limit:
    description: 1回のモデル入力のUTF-8バイト上限。トークン数ではなく、履歴・ツール定義を含む保守的な制限です。
    required: false
    default: "96000"
  model-input-bytes-per-minute:
    description: この実行で1分間に送るモデル入力のバイト予算。別ジョブと共有するGoogleプロジェクト全体の上限ではありません。
    required: false
    default: "384000"
  model-output-token-limit:
    description: 1回のモデル応答の最大出力トークン数。
    required: false
    default: "8192"
  source-directory:
    description: Pull Requestと完全なGit履歴を含むcheckoutディレクトリ。
    required: false
    default: .
  sandbox-image:
    description: カスタムDockerイメージ。未指定時はpnpm・actionlintを含む既定イメージを構築します。
    required: false
    default: ""
  sandbox-network:
    description: noneは通信禁止、publicは公開HTTP(S)通信を許可。ホスト・プライベート網への通信は拒否します。
    required: false
    default: none
  mcp-servers:
    description: 外部文書・Issueの参照に使うHTTPS MCPサーバーのJSON配列。接続先・説明・許可する読み取りツールを指定します。
    required: false
    default: "[]"
  mcp-headers:
    description: MCPサーバー名をキーにしたHTTPヘッダーのJSON。認証情報はSecretsから渡し、サンドボックスには渡しません。
    required: false
    default: "{}"
  request-limit:
    description: 出力検証の再試行を含むモデルリクエスト回数の安全上限（最大240）。入力バイト予算とは別に適用します。
    required: false
    default: "120"
  tool-call-limit:
    description: 調査ツール呼び出し回数の安全上限（最大100）。ページ取得や返信の確認も含み、入力バイト予算とは別に適用します。
    required: false
    default: "100"
  investigation-tool-limit:
    description: 最終結果の生成余力を残すためモデルに指示する調査回数の目安。tool-call-limit以下で指定します（最大100）。
    required: false
    default: "80"

outputs:
  report:
    description: 観測・根拠付き評価・指摘を含む検証済みJSON（schema_version 2）。
    value: ${{ steps.review.outputs.report }}

runs:
  using: composite
  steps:
    - name: 議論の取得時とActionの実装が一致することを確認
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        AI_REVIEW_ACTION_PATH: ${{ github.action_path }}
        REVIEW_CONTEXT: ${{ inputs.review-context }}
      with:
        script: |
          const { assertImplementationRevision } = require(process.env.AI_REVIEW_ACTION_PATH + "/context/index.cjs");
          assertImplementationRevision(process.env.REVIEW_CONTEXT);

    - name: uvをインストール
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock

    - name: 依存関係をインストール
      shell: bash
      run: uv sync --frozen --no-dev --project "$GITHUB_ACTION_PATH"

    - name: レビュー用Dockerイメージを準備
      id: sandbox
      shell: bash
      env:
        CUSTOM_IMAGE: ${{ inputs.sandbox-image }}
        SANDBOX_NETWORK: ${{ inputs.sandbox-network }}
      run: |
        set -euo pipefail
        if [[ "$SANDBOX_NETWORK" != "none" && "$SANDBOX_NETWORK" != "public" ]]; then
          echo "::error::sandbox-network は none または public を指定してください。"
          exit 1
        fi
        image="$CUSTOM_IMAGE"
        if [[ -z "$image" ]]; then
          image="ai-review-sandbox:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          docker build --tag "$image" "$GITHUB_ACTION_PATH/sandbox"
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: Pull Requestをレビュー
      id: review
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        PYDANTIC_AI_NO_BANNER: "1"
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_LANGUAGE: ${{ inputs.review-language }}
        REVIEW_REPOSITORY: ${{ inputs.repository }}
        REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        REVIEW_BASE_SHA: ${{ inputs.base-sha }}
        REVIEW_HEAD_SHA: ${{ inputs.head-sha }}
        REVIEW_INCREMENTAL_BASE_SHA: ${{ inputs.review-base-sha }}
        REVIEW_CONTEXT: ${{ inputs.review-context }}
        REVIEW_MODEL_INPUT_BYTE_LIMIT: ${{ inputs.model-input-byte-limit }}
        REVIEW_MODEL_INPUT_BYTES_PER_MINUTE: ${{ inputs.model-input-bytes-per-minute }}
        REVIEW_MODEL_OUTPUT_TOKEN_LIMIT: ${{ inputs.model-output-token-limit }}
        REVIEW_SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        REVIEW_SANDBOX_IMAGE: ${{ steps.sandbox.outputs.image }}
        REVIEW_SANDBOX_NETWORK: ${{ inputs.sandbox-network }}
        REVIEW_MCP_SERVERS: ${{ inputs.mcp-servers }}
        REVIEW_MCP_HEADERS: ${{ inputs.mcp-headers }}
        REVIEW_REQUEST_LIMIT: ${{ inputs.request-limit }}
        REVIEW_TOOL_CALL_LIMIT: ${{ inputs.tool-call-limit }}
        REVIEW_INVESTIGATION_TOOL_LIMIT: ${{ inputs.investigation-tool-limit }}
      run: exec "$GITHUB_ACTION_PATH/.venv/bin/python" "$GITHUB_ACTION_PATH/src/review.py"
