name: AIレビュー結果を投稿
description: 検証済みのAIレビューJSONから判定し、対象コミットへ正式なPR Reviewを投稿します。
author: ynufes-tech

inputs:
  report:
    description: 調査Actionが返したJSONレポート。
    required: true
  review-context:
    description: context Actionが取得したPRの議論JSON。指定すると要約を更新し、既存の指摘を再利用します。
    required: false
    default: ""
  pull-request-number:
    description: PRイベント以外から投稿する対象PR番号。指定する場合は調査時のhead-shaとbase-shaも必須です。
    required: false
    default: ""
  head-sha:
    description: pull-request-numberを指定する場合の、調査対象Head SHA。
    required: false
    default: ""
  base-sha:
    description: pull-request-numberを指定する場合の、調査対象Base SHA。
    required: false
    default: ""
  github-token:
    description: pull-requests:write権限を持つGitHubトークン。
    required: false
    default: ${{ github.token }}
  reviewer-login:
    description: 投稿トークンのアカウント名。GitHub Appの場合は「app-slug[bot]」を指定します。
    required: false
    default: github-actions[bot]
  model:
    description: レビュー本文に表示するモデル名。
    required: false
    default: gemini-3.8-flash

outputs:
  published:
    description: この実行でレビュー・返信・要約を投稿または更新した場合はtrue。
    value: ${{ steps.publish.outputs.published }}
  event:
    description: 今回投稿・更新した結果の判定（APPROVE・COMMENT・REQUEST_CHANGES）。すべて省略した場合は空文字。
    value: ${{ steps.publish.outputs.event }}
  review-url:
    description: 投稿したレビューまたは最新の要約のURL。すべて省略した場合は空文字。
    value: ${{ steps.publish.outputs.review-url }}

runs:
  using: composite
  steps:
    - name: JSONを検証してPR Reviewを投稿
      id: publish
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        AI_REVIEW_PUBLISH_PATH: ${{ github.action_path }}
        REVIEW_JSON: ${{ inputs.report }}
        REVIEW_CONTEXT: ${{ inputs.review-context }}
        REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        REVIEW_HEAD_SHA: ${{ inputs.head-sha }}
        REVIEW_BASE_SHA: ${{ inputs.base-sha }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEWER_LOGIN: ${{ inputs.reviewer-login }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { publishReview } = require(process.env.AI_REVIEW_PUBLISH_PATH + "/index.cjs");
          const result = await publishReview({
            github, context, core,
            reportJson: process.env.REVIEW_JSON,
            reviewContext: process.env.REVIEW_CONTEXT,
            pullRequestNumber: process.env.REVIEW_PULL_REQUEST_NUMBER,
            headSha: process.env.REVIEW_HEAD_SHA,
            baseSha: process.env.REVIEW_BASE_SHA,
            model: process.env.REVIEW_MODEL,
            reviewerLogin: process.env.REVIEWER_LOGIN,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            serverUrl: process.env.GITHUB_SERVER_URL
          });
          core.setOutput("published", String(result.published));
          core.setOutput("event", result.event || "");
          core.setOutput("review-url", result.reviewUrl || "");
