[project]
name = "ynufes-ai-review-action"
version = "2.0.0"
description = "Pydantic AIと分離サンドボックスによるPull RequestレビューAction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx2==2.12.0",
  "pydantic-ai-slim[google,mcp,openai]==2.43.0",
]

[dependency-groups]
dev = [
  "ruff==0.16.7",
  "ty==0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"
